{% extends 'base.html' %}{% block title %}Sign in – Tethys Anime Hub{% endblock %}
{% block content %}<section class="login-panel"><h1>Sign in to Tethys</h1>{% if error %}<p class="error">Incorrect username or password.</p>{% endif %}
<form method="post" action="/login"><label>Username<input name="username" required autofocus autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button type="submit">Sign in</button></form></section>{% endblock %}
