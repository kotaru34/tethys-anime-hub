{% extends 'base.html' %}{% block title %}Вхід – Kotaru Anime{% endblock %}
{% block content %}<section class="login-panel"><h1>Вхід у каталог</h1>{% if error %}<p class="error">Неправильний логін або пароль.</p>{% endif %}
<form method="post" action="/login"><label>Користувач<input name="username" required autofocus autocomplete="username"></label>
<label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
<button type="submit">Увійти</button></form></section>{% endblock %}
